name: leak-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: positive control — detector must fire on the configured tokens
        env:
          LEAK_TOKENS: ${{ secrets.LEAK_TOKENS }}
        run: python scripts/scan_leaks.py --self-test   # exit 2 (loud) if the secret is unset
      - name: scan full history
        env:
          LEAK_TOKENS: ${{ secrets.LEAK_TOKENS }}
        run: python scripts/scan_leaks.py .
